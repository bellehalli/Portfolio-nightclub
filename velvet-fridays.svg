<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="t d">
  <title id="t">Velvet Fridays event poster</title>
  <desc id="d">Editorial coral, pink and lavender Vanta Social event poster.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff766e"/>
      <stop offset=".55" stop-color="#ef7f9e"/>
      <stop offset="1" stop-color="#c487df"/>
    </linearGradient>
    <radialGradient id="r" cx="75%" cy="15%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1500" rx="36" fill="url(#g)"/>
  <rect width="1200" height="1500" rx="36" fill="url(#r)"/>
  <g fill="#151515" font-family="Arial,Helvetica,sans-serif">
    <text x="90" y="115" font-size="34" font-weight="900" letter-spacing="8">VANTA SOCIAL · DETROIT</text>
    <text x="90" y="600" font-size="190" font-weight="900" letter-spacing="-12">VELVET</text>
    <text x="90" y="785" font-size="190" font-weight="900" letter-spacing="-12">FRIDAYS</text>
    <line x1="90" y1="850" x2="1110" y2="850" stroke="#151515" stroke-width="5"/>
    <text x="90" y="935" font-size="46" font-weight="800">R&amp;B · HIP-HOP · AFROBEATS</text>
    <text x="90" y="1015" font-size="40" font-weight="800">DOORS 10 PM · 21+</text>
    <text x="90" y="1280" font-size="32" font-weight="700">EVERY FRIDAY</text>
    <text x="90" y="1340" font-size="32" font-weight="700">TICKETS · GUEST LIST · TABLES</text>
